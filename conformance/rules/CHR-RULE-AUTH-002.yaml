id: CHR-RULE-AUTH-002
title: Approved evaluations cite an approval bound to the action and valid at action time
requirements: [CHR-AUTH-009]
profile: core-model
verification: semantic
applies_to: [ActionRecord]
check: >-
  For every ActionRecord approvalEvaluation with result approved, approvalId resolves to an Approval whose approved action matches the evaluated approval action, whose subjects and material-inputs digest match the record, which was issued no later than actionTime and, when validityMode is expires-at, expires no earlier than actionTime.
fixtures:
  valid: fixtures/valid/harbor
  invalid: fixtures/invalid/stale-approval
