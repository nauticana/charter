rules: [CHR-RULE-RT-010]
specification_version: 1.2.0
expected: fail
reason: The reservation times out and cannot be observed; a conforming runtime keeps it unknown, refuses the blind retry, and once the effect is observed absent settles the key as failed because the contract does not declare that retry safe
documents: ../../../../examples/harbor-manufacturing/instances
scenario:
  namespace: harbor.example
  enterprise: ENT-HARBOR
  invocation:
    actor: {kind: AgentIdentity, id: AGENT-ORDER-EXCEPTION-COORDINATOR}
    runtime: RT-OEC-PROD-01
    execution_context_id: EXEC-OE-0042-05
    assignment: ASGN-OEC-ORDER-EXCEPTION-SUPPORT
    capability: CAP-RESERVE-ORDER-STOCK
    contract_version: "1"
    required_features: [reservation-create]
    resource_scope: order exceptions assigned to the agent
    organizational_context: OU-SALES-OPERATIONS
    approved_action: CAP-APPROVE-CREDIT-EXCEPTION
    material_inputs_digest: sha256:4f1d2a9c7b3e5d6f8a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f
    subjects: [{kind: ProcessInstance, id: PROCINST-OE-2026-0042}]
    idempotency_key: IDEMP-0042-BLIND-1
    at: 2026-06-18T17:12:30Z
    measures:
      reservation-value: {value: 1850000, currency: USD, currency_exponent: 2}
      reservation-duration: {value: 48, unit: hour}
      credit-exposure: {value: 1850000, currency: USD, currency_exponent: 2}
  steps:
    - name: transport times out
      invoke: {}
      transport: {error: unknown}
      expect: {status: unknown, requirement: CHR-SEC-008, transport_calls: 1, evidence: true}
    - name: reconciliation cannot observe
      reconcile: {at: 2026-06-18T17:15:45Z}
      observation: {error: reservation read timed out}
      expect: {status: unknown, requirement: CHR-EVID-012, transport_calls: 1, reconciled: true, escalated: true}
    - name: blind retry
      invoke: {}
      transport: {outcome: reserved, reference: "0000088421"}
      expect: {status: unknown, requirement: CHR-SEC-008, transport_calls: 1}
    - name: reconciliation observes the effect absent
      reconcile: {at: 2026-06-18T17:20:00Z}
      observation: {postconditions: {POST-RESERVATION-HELD: violated}}
      expect: {status: failed, requirement: CHR-CAP-010, transport_calls: 1, reconciled: true}
    - name: retry of the failed key
      invoke: {}
      transport: {outcome: reserved, reference: "0000088421"}
      expect: {status: failed, transport_calls: 1}
