table: json_schema_type
comment: One permitted JSON type of a schema node.
columns:
  - name: partner_id
    type: BIGINT
  - name: json_schema_node_id
    type: BIGINT
  - name: json_type
    type: CHAR(1)
primary_key: [partner_id, json_schema_node_id, json_type]
foreign_keys:
  - name: node_types
    columns: [partner_id, json_schema_node_id]
    references:
      table: json_schema_node
      columns: [partner_id, id]
checks:
  - name: json_schema_type_json_type_ck
    expression: "json_type IN ('O', 'A', 'S', 'N', 'I', 'B', 'Z')"
