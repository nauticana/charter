table: json_schema_enum
comment: "One permitted value of a schema node's enumeration."
columns:
  - name: partner_id
    type: BIGINT
  - name: json_schema_node_id
    type: BIGINT
  - name: ordinal
    type: SMALLINT
  - name: json_value_id
    type: BIGINT
primary_key: [partner_id, json_schema_node_id, ordinal]
indexes:
  - name: json_schema_enum_value_ux
    columns: [partner_id, json_value_id]
    unique: true
foreign_keys:
  - name: enum_value
    columns: [partner_id, json_value_id]
    references:
      table: json_value
      columns: [partner_id, id]
  - name: node_enum
    columns: [partner_id, json_schema_node_id]
    references:
      table: json_schema_node
      columns: [partner_id, id]
