table: capability_contract_postcondition_outcome
comment: A declared outcome a postcondition applies to.
columns:
  - name: partner_id
    type: BIGINT
  - name: capability_contract_id
    type: BIGINT
  - name: version_no
    type: INT
  - name: postcondition_key
    type: VARCHAR(120)
  - name: outcome
    type: VARCHAR(500)
primary_key: [partner_id, capability_contract_id, version_no, postcondition_key, outcome]
indexes:
  - name: outcome_postconditions_ix
    columns: [partner_id, capability_contract_id, version_no, outcome]
foreign_keys:
  - name: outcome_postconditions
    columns: [partner_id, capability_contract_id, version_no, outcome]
    references:
      table: capability_contract_outcome
      columns: [partner_id, capability_contract_id, version_no, outcome]
  - name: postcondition_outcomes
    columns: [partner_id, capability_contract_id, version_no, postcondition_key]
    references:
      table: capability_contract_postcondition
      columns: [partner_id, capability_contract_id, version_no, postcondition_key]
