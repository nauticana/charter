table: action_record_subject
comment: An object an action acted on.
columns:
  - name: partner_id
    type: BIGINT
  - name: action_record_id
    type: BIGINT
  - name: subject_id
    type: BIGINT
primary_key: [partner_id, action_record_id, subject_id]
indexes:
  - name: subject_actions_ix
    columns: [partner_id, subject_id]
foreign_keys:
  - name: action_subjects
    columns: [partner_id, action_record_id]
    references:
      table: action_record
      columns: [partner_id, id]
  - name: subject_actions
    columns: [partner_id, subject_id]
    references:
      table: enterprise_object
      columns: [partner_id, id]
