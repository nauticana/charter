table: evidence_bundle_evidence_record
comment: An evidence record in a bundle.
columns:
  - name: partner_id
    type: BIGINT
  - name: evidence_bundle_id
    type: BIGINT
  - name: evidence_record_id
    type: BIGINT
primary_key: [partner_id, evidence_bundle_id, evidence_record_id]
indexes:
  - name: evidence_record_bundles_ix
    columns: [partner_id, evidence_record_id]
foreign_keys:
  - name: evidence_record_bundles
    columns: [partner_id, evidence_record_id]
    references:
      table: evidence_record
      columns: [partner_id, id]
  - name: bundle_evidence_records
    columns: [partner_id, evidence_bundle_id]
    references:
      table: evidence_bundle
      columns: [partner_id, id]
