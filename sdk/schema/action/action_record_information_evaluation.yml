table: action_record_information_evaluation
comment: The result of one information-use evaluation for an action.
columns:
  - name: partner_id
    type: BIGINT
  - name: action_record_id
    type: BIGINT
  - name: ordinal
    type: SMALLINT
  - name: information_definition_id
    type: BIGINT
  - name: purpose
    type: VARCHAR(500)
  - name: result
    type: CHAR(1)
  - name: reason
    type: VARCHAR(500)
primary_key: [partner_id, action_record_id, ordinal]
indexes:
  - name: information_evaluations_ix
    columns: [partner_id, information_definition_id]
foreign_keys:
  - name: action_information_evaluations
    columns: [partner_id, action_record_id]
    references:
      table: action_record
      columns: [partner_id, id]
  - name: information_evaluations
    columns: [partner_id, information_definition_id]
    references:
      table: information_definition
      columns: [partner_id, id]
checks:
  - name: action_record_information_evaluation_result_ck
    expression: "result IN ('A', 'D', 'E')"
