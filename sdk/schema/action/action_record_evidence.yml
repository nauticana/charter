table: action_record_evidence
comment: An evidence record an action produced or used.
columns:
  - name: partner_id
    type: BIGINT
  - name: action_record_id
    type: BIGINT
  - name: evidence_record_id
    type: BIGINT
primary_key: [partner_id, action_record_id, evidence_record_id]
indexes:
  - name: evidence_actions_ix
    columns: [partner_id, evidence_record_id]
foreign_keys:
  - name: action_evidence
    columns: [partner_id, action_record_id]
    references:
      table: action_record
      columns: [partner_id, id]
  - name: evidence_actions
    columns: [partner_id, evidence_record_id]
    references:
      table: evidence_record
      columns: [partner_id, id]
