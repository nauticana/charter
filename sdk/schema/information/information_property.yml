table: information_property
comment: "A property of an information definition's shape, with its type and classification."
columns:
  - name: partner_id
    type: BIGINT
  - name: information_definition_id
    type: BIGINT
  - name: property_name
    type: VARCHAR(120)
  - name: ordinal
    type: SMALLINT
  - name: json_type
    type: CHAR(1)
  - name: required
    type: BOOLEAN
    nullable: true
  - name: classification
    type: VARCHAR(120)
    nullable: true
primary_key: [partner_id, information_definition_id, property_name]
indexes:
  - name: information_property_ordinal_ux
    columns: [partner_id, information_definition_id, ordinal]
    unique: true
foreign_keys:
  - name: information_properties
    columns: [partner_id, information_definition_id]
    references:
      table: information_definition
      columns: [partner_id, id]
checks:
  - name: information_property_json_type_ck
    expression: "json_type IN ('O', 'A', 'S', 'N', 'I', 'B')"
