table: information_definition_policy
comment: A governance policy an information definition is subject to.
columns:
  - name: partner_id
    type: BIGINT
  - name: information_definition_id
    type: BIGINT
  - name: information_governance_policy_id
    type: BIGINT
primary_key: [partner_id, information_definition_id, information_governance_policy_id]
indexes:
  - name: policy_information_ix
    columns: [partner_id, information_governance_policy_id]
foreign_keys:
  - name: information_policies
    columns: [partner_id, information_definition_id]
    references:
      table: information_definition
      columns: [partner_id, id]
  - name: policy_information
    columns: [partner_id, information_governance_policy_id]
    references:
      table: information_governance_policy
      columns: [partner_id, id]
