table: identity_lifecycle_transition
comment: "One effective lifecycle state change of a human or agent identity, kept to evaluate past actions."
columns:
  - name: partner_id
    type: BIGINT
  - name: enterprise_object_id
    type: BIGINT
  - name: version_no
    type: INT
  - name: effective_at
    type: TIMESTAMP
  - name: lifecycle_state
    type: CHAR(1)
  - name: authority_id
    type: BIGINT
    nullable: true
primary_key: [partner_id, enterprise_object_id, version_no, effective_at]
indexes:
  - name: transition_authority_ix
    columns: [partner_id, authority_id]
foreign_keys:
  - name: identity_transitions
    columns: [partner_id, enterprise_object_id, version_no]
    references:
      table: enterprise_object_version
      columns: [partner_id, enterprise_object_id, version_no]
  - name: transition_authority
    columns: [partner_id, authority_id]
    references:
      table: enterprise_object
      columns: [partner_id, id]
checks:
  - name: identity_lifecycle_transition_lifecycle_state_ck
    expression: "lifecycle_state IN ('P', 'A', 'S', 'R')"
