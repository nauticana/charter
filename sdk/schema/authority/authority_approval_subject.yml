table: authority_approval_subject
comment: An object an approval applies to.
columns:
  - name: partner_id
    type: BIGINT
  - name: approval_id
    type: BIGINT
  - name: subject_id
    type: BIGINT
primary_key: [partner_id, approval_id, subject_id]
indexes:
  - name: subject_approvals_ix
    columns: [partner_id, subject_id]
foreign_keys:
  - name: subject_approvals
    columns: [partner_id, subject_id]
    references:
      table: enterprise_object
      columns: [partner_id, id]
  - name: approval_subjects
    columns: [partner_id, approval_id]
    references:
      table: authority_approval
      columns: [partner_id, id]
