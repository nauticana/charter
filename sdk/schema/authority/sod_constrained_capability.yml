table: sod_constrained_capability
comment: A capability contract a separation of duties constraint covers.
columns:
  - name: partner_id
    type: BIGINT
  - name: sod_constraint_id
    type: BIGINT
  - name: capability_contract_id
    type: BIGINT
primary_key: [partner_id, sod_constraint_id, capability_contract_id]
indexes:
  - name: capability_constraints_ix
    columns: [partner_id, capability_contract_id]
foreign_keys:
  - name: capability_constraints
    columns: [partner_id, capability_contract_id]
    references:
      table: capability_contract
      columns: [partner_id, id]
  - name: constraint_capabilities
    columns: [partner_id, sod_constraint_id]
    references:
      table: sod_constraint
      columns: [partner_id, id]
