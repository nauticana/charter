table: authority_approval
comment: "An approval a human or agent issued for one capability contract or action class on given material inputs, with its validity."
columns:
  - name: partner_id
    type: BIGINT
  - name: id
    type: BIGINT
  - name: approver_human_id
    type: BIGINT
    nullable: true
  - name: approver_agent_id
    type: BIGINT
    nullable: true
  - name: responsibility_id
    type: BIGINT
    nullable: true
  - name: approved_capability_id
    type: BIGINT
    nullable: true
  - name: approved_action_class
    type: VARCHAR(200)
    nullable: true
  - name: material_inputs_digest
    type: VARCHAR(500)
  - name: issued_at
    type: TIMESTAMP
  - name: validity_mode
    type: CHAR(1)
  - name: expires_at
    type: TIMESTAMP
    nullable: true
  - name: open_ended_justification
    type: VARCHAR(500)
    nullable: true
  - name: sod_exception_id
    type: BIGINT
    nullable: true
primary_key: [partner_id, id]
indexes:
  - name: responsibility_approvals_ix
    columns: [partner_id, responsibility_id]
  - name: approved_capability_ix
    columns: [partner_id, approved_capability_id]
  - name: agent_approvals_ix
    columns: [partner_id, approver_agent_id]
  - name: exception_approvals_ix
    columns: [partner_id, sod_exception_id]
  - name: human_approvals_ix
    columns: [partner_id, approver_human_id]
foreign_keys:
  - name: object_authority_approval
    columns: [partner_id, id]
    references:
      table: enterprise_object
      columns: [partner_id, id]
  - name: responsibility_approvals
    columns: [partner_id, responsibility_id]
    references:
      table: responsibility
      columns: [partner_id, id]
  - name: approved_capability
    columns: [partner_id, approved_capability_id]
    references:
      table: capability_contract
      columns: [partner_id, id]
  - name: agent_approvals
    columns: [partner_id, approver_agent_id]
    references:
      table: agent_identity
      columns: [partner_id, id]
  - name: exception_approvals
    columns: [partner_id, sod_exception_id]
    references:
      table: sod_exception
      columns: [partner_id, id]
  - name: human_approvals
    columns: [partner_id, approver_human_id]
    references:
      table: human_identity
      columns: [partner_id, id]
checks:
  - name: authority_approval_validity_mode_ck
    expression: "validity_mode IN ('E', 'O')"
  - name: authority_approval_approver_ck
    expression: "(CASE WHEN approver_human_id IS NOT NULL THEN 1 ELSE 0 END + CASE WHEN approver_agent_id IS NOT NULL THEN 1 ELSE 0 END) = 1"
  - name: authority_approval_approved_ck
    expression: "(CASE WHEN approved_capability_id IS NOT NULL THEN 1 ELSE 0 END + CASE WHEN approved_action_class IS NOT NULL THEN 1 ELSE 0 END) = 1"
  - name: authority_approval_validity_ck
    expression: "(validity_mode = 'E' AND expires_at IS NOT NULL AND open_ended_justification IS NULL) OR (validity_mode = 'O' AND expires_at IS NULL AND open_ended_justification IS NOT NULL)"
