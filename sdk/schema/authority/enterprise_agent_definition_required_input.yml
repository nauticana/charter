table: enterprise_agent_definition_required_input
comment: "A required input statement of an agent definition version, in order."
columns:
  - name: partner_id
    type: BIGINT
  - name: agent_definition_id
    type: BIGINT
  - name: version_no
    type: INT
  - name: ordinal
    type: SMALLINT
  - name: statement
    type: VARCHAR(500)
primary_key: [partner_id, agent_definition_id, version_no, ordinal]
foreign_keys:
  - name: definition_required_inputs
    columns: [partner_id, agent_definition_id, version_no]
    references:
      table: enterprise_agent_definition_version
      columns: [partner_id, agent_definition_id, version_no]
