table: mediation_scope_capability
comment: A capability contract a mediation profile covers.
columns:
  - name: partner_id
    type: BIGINT
  - name: mediation_profile_id
    type: BIGINT
  - name: capability_contract_id
    type: BIGINT
primary_key: [partner_id, mediation_profile_id, capability_contract_id]
indexes:
  - name: capability_mediation_profiles_ix
    columns: [partner_id, capability_contract_id]
foreign_keys:
  - name: profile_scope_capabilities
    columns: [partner_id, mediation_profile_id]
    references:
      table: mediation_profile
      columns: [partner_id, id]
  - name: capability_mediation_profiles
    columns: [partner_id, capability_contract_id]
    references:
      table: capability_contract
      columns: [partner_id, id]
