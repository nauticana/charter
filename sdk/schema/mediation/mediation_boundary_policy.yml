table: mediation_boundary_policy
comment: A governance policy that bounds a mediation profile.
columns:
  - name: partner_id
    type: BIGINT
  - name: mediation_profile_id
    type: BIGINT
  - name: information_governance_policy_id
    type: BIGINT
primary_key: [partner_id, mediation_profile_id, information_governance_policy_id]
indexes:
  - name: policy_boundary_profiles_ix
    columns: [partner_id, information_governance_policy_id]
foreign_keys:
  - name: policy_boundary_profiles
    columns: [partner_id, information_governance_policy_id]
    references:
      table: information_governance_policy
      columns: [partner_id, id]
  - name: profile_boundary_policies
    columns: [partner_id, mediation_profile_id]
    references:
      table: mediation_profile
      columns: [partner_id, id]
