table: mediation_scope_agent
comment: An agent identity a mediation profile covers.
columns:
  - name: partner_id
    type: BIGINT
  - name: mediation_profile_id
    type: BIGINT
  - name: agent_identity_id
    type: BIGINT
primary_key: [partner_id, mediation_profile_id, agent_identity_id]
indexes:
  - name: agent_mediation_profiles_ix
    columns: [partner_id, agent_identity_id]
foreign_keys:
  - name: agent_mediation_profiles
    columns: [partner_id, agent_identity_id]
    references:
      table: agent_identity
      columns: [partner_id, id]
  - name: profile_scope_agents
    columns: [partner_id, mediation_profile_id]
    references:
      table: mediation_profile
      columns: [partner_id, id]
