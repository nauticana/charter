table: system_event_binding_version
comment: "One immutable mapping of an external event to a Charter trigger, with its delivery semantics."
columns:
  - name: partner_id
    type: BIGINT
  - name: event_binding_id
    type: BIGINT
  - name: version_no
    type: INT
  - name: system_profile_id
    type: BIGINT
  - name: external_event
    type: VARCHAR(200)
  - name: charter_trigger
    type: VARCHAR(200)
  - name: delivery_semantics
    type: CHAR(1)
primary_key: [partner_id, event_binding_id, version_no]
indexes:
  - name: profile_event_bindings_ix
    columns: [partner_id, system_profile_id]
foreign_keys:
  - name: system_event_binding_version_envelope
    columns: [partner_id, event_binding_id, version_no]
    references:
      table: enterprise_object_version
      columns: [partner_id, enterprise_object_id, version_no]
  - name: event_binding_versions
    columns: [partner_id, event_binding_id]
    references:
      table: system_event_binding
      columns: [partner_id, id]
  - name: profile_event_bindings
    columns: [partner_id, system_profile_id]
    references:
      table: system_profile
      columns: [partner_id, id]
checks:
  - name: system_event_binding_version_delivery_semantics_ck
    expression: "delivery_semantics IN ('M', 'L', 'E')"
