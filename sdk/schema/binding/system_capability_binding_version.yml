table: system_capability_binding_version
comment: One immutable mapping of a capability contract to an external operation of a system profile.
columns:
  - name: partner_id
    type: BIGINT
  - name: capability_binding_id
    type: BIGINT
  - name: version_no
    type: INT
  - name: system_profile_id
    type: BIGINT
  - name: capability_contract_id
    type: BIGINT
  - name: operation
    type: VARCHAR(500)
  - name: input_mapping
    type: VARCHAR(1000)
  - name: output_mapping
    type: VARCHAR(1000)
  - name: business_error_mapping
    type: VARCHAR(1000)
  - name: authority_check_mapping
    type: VARCHAR(1000)
  - name: idempotency_mapping
    type: VARCHAR(1000)
  - name: evidence_mapping
    type: VARCHAR(1000)
primary_key: [partner_id, capability_binding_id, version_no]
indexes:
  - name: profile_capability_bindings_ix
    columns: [partner_id, system_profile_id]
  - name: contract_capability_bindings_ix
    columns: [partner_id, capability_contract_id]
foreign_keys:
  - name: system_capability_binding_version_envelope
    columns: [partner_id, capability_binding_id, version_no]
    references:
      table: enterprise_object_version
      columns: [partner_id, enterprise_object_id, version_no]
  - name: capability_binding_versions
    columns: [partner_id, capability_binding_id]
    references:
      table: system_capability_binding
      columns: [partner_id, id]
  - name: profile_capability_bindings
    columns: [partner_id, system_profile_id]
    references:
      table: system_profile
      columns: [partner_id, id]
  - name: contract_capability_bindings
    columns: [partner_id, capability_contract_id]
    references:
      table: capability_contract
      columns: [partner_id, id]
