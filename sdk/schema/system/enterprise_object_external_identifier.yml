table: enterprise_object_external_identifier
comment: "The key an object carries in an external system profile, effective for a validity period. Owner kinds: OU, PT, PO, RL, HI."
extensions: [btree_gist]
columns:
  - name: partner_id
    type: BIGINT
  - name: enterprise_object_id
    type: BIGINT
  - name: version_no
    type: INT
  - name: system_profile_id
    type: BIGINT
  - name: external_id
    type: VARCHAR(200)
  - name: valid_from
    type: DATE
    nullable: true
  - name: valid_to
    type: DATE
    nullable: true
primary_key: [partner_id, enterprise_object_id, version_no, system_profile_id, external_id]
indexes:
  - name: profile_external_identifiers_ix
    columns: [partner_id, system_profile_id]
foreign_keys:
  - name: version_external_identifiers
    columns: [partner_id, enterprise_object_id, version_no]
    references:
      table: enterprise_object_version
      columns: [partner_id, enterprise_object_id, version_no]
  - name: profile_external_identifiers
    columns: [partner_id, system_profile_id]
    references:
      table: system_profile
      columns: [partner_id, id]
checks:
  - name: enterprise_object_external_identifier_validity_ck
    expression: "valid_to IS NULL OR valid_from IS NULL OR valid_to >= valid_from"
exclusions:
  - name: enterprise_object_external_identifier_no_overlap
    using: gist
    expression: "partner_id WITH =, enterprise_object_id WITH =, version_no WITH =, system_profile_id WITH =, daterange(valid_from, valid_to, '[]') WITH &&"
