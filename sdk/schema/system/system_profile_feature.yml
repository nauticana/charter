table: system_profile_feature
comment: "A feature a system profile supports, in order."
columns:
  - name: partner_id
    type: BIGINT
  - name: system_profile_id
    type: BIGINT
  - name: ordinal
    type: SMALLINT
  - name: feature
    type: VARCHAR(500)
primary_key: [partner_id, system_profile_id, ordinal]
foreign_keys:
  - name: profile_features
    columns: [partner_id, system_profile_id]
    references:
      table: system_profile
      columns: [partner_id, id]
