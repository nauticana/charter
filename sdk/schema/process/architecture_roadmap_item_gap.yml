table: architecture_roadmap_item_gap
comment: A gap a roadmap item closes.
columns:
  - name: partner_id
    type: BIGINT
  - name: roadmap_item_id
    type: BIGINT
  - name: gap_id
    type: BIGINT
primary_key: [partner_id, roadmap_item_id, gap_id]
indexes:
  - name: gap_roadmap_items_ix
    columns: [partner_id, gap_id]
foreign_keys:
  - name: item_gaps
    columns: [partner_id, roadmap_item_id]
    references:
      table: architecture_roadmap_item
      columns: [partner_id, id]
  - name: gap_roadmap_items
    columns: [partner_id, gap_id]
    references:
      table: architecture_gap
      columns: [partner_id, id]
